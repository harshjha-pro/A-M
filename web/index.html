<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>%AM_APP_TITLE%</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Ayush &amp; Mahi's wedding planner for the family.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon-48.png" type="image/png">

    <!-- Keep browser chrome and installed-PWA surfaces in the warm ivory brand palette. -->
    <meta name="theme-color" content="#F8F2EB" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#F8F2EB" media="(prefers-color-scheme: dark)">

    <!-- iPhone -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-title" content="%AM_APP_SHORT%">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">

    <!-- Adds class="ios" for Dynamic Type. External scripts are required by the CSP. -->
    <script src="/ios-class.js"></script>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please turn on JavaScript to use A&amp;M Wedding.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: side, in: query, schema: { type: string, enum: [bride, groom, both] } }
        - { name: event, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: rsvp, in: query, schema: { type: string }, description: 'Comma list of not_asked, waiting, coming, not_coming. Needs event.' }
        - { name: group, in: query, schema: { type: string } }
        - { name: area, in: query, schema: { type: string } }
        - { name: food, in: query, schema: { $ref: '#/components/schemas/Food' } }
        - { name: vip, in: query, schema: { type: boolean } }
        - { name: no_phone, in: query, schema: { type: boolean } }
        - { name: possible_duplicates, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -created_at, area, group] } }

openapi: 3.1.0
info:
  title: A&M Wedding API
  version: 1.2.0-draft
  summary: REST contract between the A&M Wedding PWA and its PHP backend.
  description: |
    Single-wedding planner. Same origin as the PWA, JSON only, no CORS.
    - IDs in URLs and JSON are ULID public_ids. Numeric IDs never leave the server.
    - Date-times are ISO 8601 UTC with Z. Dates are IST calendar dates. Money is integer paise.
    - Every reply uses the envelope {ok, data, meta} or {ok:false, error, meta}.
    - Every write while logged in sends X-CSRF-Token and Idempotency-Key.
    - Every PATCH, PUT on an existing record, and single-record DELETE sends If-Match with the version.
    - All requests should send X-Client-Version and X-Device.
    - x-permission on each operation: All, Ed (Owner, Partner, Family), Adm (Owner, Partner), Own, $ (money users), Self.
servers:
  - url: https://{subdomain}.lumorrahouse.com/api/v1
    variables:
      subdomain:
        default: wedding
        description: wedding.lumorrahouse.com (API14). Read from APP_URL in .env.
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Members
  - name: Settings
  - name: Dashboard
  - name: Events
  - name: Tasks
  - name: Guests
  - name: Imports
  - name: Money
  - name: Documents
  - name: History
  - name: Trash
  - name: Export
  - name: Sync
  - name: Health

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with phone and password
      x-permission: Anyone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in. Sets the __Host-am_session cookie.
          headers:
            Set-Cookie: { schema: { type: string }, description: '__Host-am_session=...; Max-Age=7776000; Path=/; Secure; HttpOnly; SameSite=Lax' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out this phone
      x-permission: Self
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Log out all my phones
      x-permission: Self
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      responses:
        '200':
          description: All my sessions revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { type: object, properties: { sessions_revoked: { type: integer } } } }
        default: { $ref: '#/components/responses/Error' }
  /session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current user, permissions and CSRF token. This is the refresh (slides the 90 days).
      x-permission: Self
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/SessionInfo' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change my password. Other sessions are revoked; this one gets a new cookie.
      x-permission: Self
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Email a reset link. Off until MAIL_ENABLED. Always 202.
      x-permission: Anyone
      x-release: Off in R1 (API1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                email: { type: string, format: email }
      responses:
        '202': { $ref: '#/components/responses/Empty' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password-link/inspect:
    post:
      tags: [Auth]
      operationId: inspectPasswordLink
      summary: Check an invite or reset link before showing the form
      x-permission: Anyone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: Link is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: object
                        properties:
                          purpose: { type: string, enum: [invite, reset] }
                          name: { type: string }
                          phone_masked: { type: string, examples: ['+91 98••• ••345'] }
                          expires_at: { $ref: '#/components/schemas/DateTime' }
        '410': { $ref: '#/components/responses/Gone' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password-link/complete:
    post:
      tags: [Auth]
      operationId: completePasswordLink
      summary: Set a password from a link and log in
      x-permission: Anyone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LinkToken'
                - type: object
                  required: [new_password]
                  properties:
                    new_password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Password set, logged in (cookie set)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /setup/owner:
    post:
      tags: [Auth]
      operationId: setupOwner
      summary: First run only. Creates the Owner. Disabled once an owner exists.
      x-permission: Holder of SETUP_TOKEN
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_token, name, phone, password]
              properties:
                setup_token: { type: string }
                name: { type: string, minLength: 1, maxLength: 80 }
                phone: { $ref: '#/components/schemas/Phone' }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '201':
          description: Owner created and logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/AuthResult' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Members
  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: All members (not paged). Family and Viewer get id, name, phone, role, left only.
      x-permission: All
      parameters:
        - { name: include_inactive, in: query, schema: { type: boolean }, description: Adm only }
      responses:
        '200': { $ref: '#/components/responses/MemberList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Members]
      operationId: createMember
      summary: Add a member and set a password or make an invite link
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '201':
          description: Created. Secrets appear once and are never stored in the idempotent reply.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/MemberCreated' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /members/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Members]
      operationId: getMember
      summary: One member with last seen and devices
      x-permission: Adm, Self
      responses:
        '200': { $ref: '#/components/responses/MemberOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Edit a member. Deactivate with is_active false. Members are never deleted.
      x-permission: Adm; Self (name only)
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200': { $ref: '#/components/responses/MemberOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /members/{id}/password-reset:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Members]
      operationId: resetMemberPassword
      summary: Admin reset. Revokes all of that member's sessions.
      x-permission: Adm (Partner cannot reset the Owner)
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [set, generate, link] }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Reset done
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: object
                        properties:
                          password_once: { type: [string, 'null'] }
                          setup_link: { type: [string, 'null'] }
                          setup_link_expires_at: { oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ] }
                          sessions_revoked: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      tags: [Members]
      operationId: mySessions
      summary: My logged-in phones
      x-permission: Self
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            device_label: { type: [string, 'null'] }
                            last_used_at: { $ref: '#/components/schemas/DateTime' }
                            current: { type: boolean }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Settings & safety
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Wedding facts (total budget only for money users)
      x-permission: All
      responses:
        '200': { $ref: '#/components/responses/SettingsOne' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Edit wedding facts
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SettingsOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /settings/history:
    get:
      tags: [Settings, History]
      operationId: settingsHistory
      summary: History of settings changes
      x-permission: Adm
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { $ref: '#/components/responses/HistoryList' }
        default: { $ref: '#/components/responses/Error' }
  /backups:
    get:
      tags: [Settings]
      operationId: listBackups
      summary: Last backup runs
      x-permission: Adm
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 7 } }
      responses:
        '200':
          description: Backup runs, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/BackupRun' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /restore-drills:
    get:
      tags: [Settings]
      operationId: listRestoreDrills
      summary: Restore drill log
      x-permission: Adm
      responses:
        '200':
          description: Drills
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/RestoreDrill' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Settings]
      operationId: createRestoreDrill
      summary: Log a restore drill
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreDrillInput' }
      responses:
        '201': { $ref: '#/components/responses/RestoreDrillOne' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /restore-drills/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Settings]
      operationId: updateRestoreDrill
      summary: Fix a drill entry
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreDrillInput' }
      responses:
        '200': { $ref: '#/components/responses/RestoreDrillOne' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Settings]
      operationId: deleteRestoreDrill
      summary: Soft delete a drill entry
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /restore-drills/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Trash]
      operationId: restoreRestoreDrill
      summary: Restore a deleted drill entry (same as the shared Restore path item)
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/RestoreDrillOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Dashboard & calendar
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: All Home cards this user may see, in one call
      x-permission: All (cards filtered by role and money)
      parameters:
        - { name: payments_window_days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/Dashboard' } }
        default: { $ref: '#/components/responses/Error' }
  /calendar:
    get:
      tags: [Dashboard]
      operationId: getCalendar
      summary: Events, open tasks with a due date, and due payments ($) in a date range
      x-permission: All (payments only $)
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/Date' }, description: Max 93 days after from }
        - { name: types, in: query, schema: { type: string, examples: ['event,task,payment'] } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: include_undated, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Days with items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: object
                        properties:
                          days:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { $ref: '#/components/schemas/Date' }
                                items: { type: array, items: { $ref: '#/components/schemas/CalendarItem' } }
                          undated: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: All events (not paged)
      x-permission: All
      parameters:
        - { name: guests_invited, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Event' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Add a custom event
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201': { $ref: '#/components/responses/EventOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
  /events/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Events]
      operationId: getEvent
      summary: Event page with counts
      x-permission: All
      responses:
        '200': { $ref: '#/components/responses/EventOne' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Edit an event
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200': { $ref: '#/components/responses/EventOne' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Soft delete; invitations go in the same batch
      x-permission: Adm
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /events/{id}/headcount:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Events]
      operationId: getEventHeadcount
      summary: People coming, waiting, not asked, not coming, Jain
      x-permission: All
      responses:
        '200':
          description: Headcount
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { $ref: '#/components/schemas/Headcount' } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /events/{id}/delete-preview:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Events]
      operationId: eventDeletePreview
      summary: Counts shown in the delete dialog
      x-permission: Adm
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: object
                        properties:
                          tasks: { type: integer }
                          invitations: { type: integer }
                          payments: { type: integer }
                          documents: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /events/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Trash]
      operationId: restoreEvent
      summary: Restore a deleted event with its same-batch invitations (same as the shared Restore path item)
      x-permission: Adm

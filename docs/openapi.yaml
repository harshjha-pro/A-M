      parameters:
        - { name: phone, in: query, schema: { type: string } }
        - { name: alt_phone, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: exclude, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties:
                      data:
                        type: object
                        properties:
                          phone_matches: { type: array, items: { $ref: '#/components/schemas/Match' } }
                          name_matches: { type: array, items: { $ref: '#/components/schemas/Match' } }
        default: { $ref: '#/components/responses/Error' }
  /households/suggestions:
    get:
      tags: [Guests]
      operationId: householdSuggestions
      summary: Autocomplete values
      x-permission: Ed
      parameters:
        - { name: field, in: query, required: true, schema: { type: string, enum: [group_name, area, relation, city] } }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: Up to 20 values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ok'
                  - properties: { data: { type: array, items: { type: string }, maxItems: 20 } }
        default: { $ref: '#/components/responses/Error' }
  /households/export:
    get:
      tags: [Guests, Export]
      operationId: exportHouseholdsCsv
      summary: Filtered guest list as CSV (UTF-8 BOM, IST, formula-safe). Audited.
      x-permission: Adm
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: side, in: query, schema: { type: string, enum: [bride, groom, both] } }
        - { name: event, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: rsvp, in: query, schema: { type: string } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /households/bulk:
    post:
      tags: [Guests]
      operationId: bulkHouseholds
      summary: One action on up to 2,000 families, one batch, one Undo
      x-permission: Ed; the delete action is Adm only
      security: [ { sessionCookie: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkRequest' }
      responses:
        '200':
          description: Done
          content:
            application/json:

<!-- @dsCard height=300 -->
<style>
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); }
  .cv svg { position: absolute; inset: 0; }
  .b-primary { fill: var(--primary); } .b-blush { fill: var(--blush); } .b-accent { fill: var(--accent); } .b-ink { fill: var(--text); }
  .r-xl { rx: var(--radius-xl); } .r-lg { rx: var(--radius-lg); }
  .p-blush { fill: var(--blush); } .p-primary { fill: var(--primary); } .p-ground { fill: var(--bg); }
  .cv__text { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .cv__name { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: .95; color: var(--text); margin: 0; white-space: nowrap; }
  .cv__tag { font-family: var(--font-sans); font-size: 14px; color: var(--text-muted); margin: 16px 0 0; }
</style>
<div class="cv">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: primary slab 176×260 (radius-xl), blush 136×150 (radius-xl), accent disc r56, ink disc r28, blush 168×150 (radius-lg) -->
    <!-- arrangement: one tall burgundy slab bleeding off the top with satellites; blush blocks bleed off the bottom and right -->
    <!-- pattern: literal motif (marigold/petal): leaf petals of two quarter-circle arcs (40px = space-10) in block colours, chosen because the README frames the brand as florals, marigold and petals -->
    <!-- steps & radii: space-10 petal, space-6 gaps; radius-xl, radius-lg, radius-pill discs -->
    <rect class="b-blush r-xl" x="496" y="160" width="136" height="170"/>
    <rect class="b-primary r-xl" x="600" y="-24" width="176" height="264"/>
    <circle class="b-accent" cx="852" cy="76" r="56"/>
    <rect class="b-blush r-lg" x="800" y="160" width="190" height="170"/>
    <circle class="b-ink" cx="740" cy="270" r="28"/>
    <g transform="translate(688 112)">
      <g class="p-blush">
        <path d="M0 0 A40 40 0 0 1 40 -40 A40 40 0 0 1 0 0 Z" transform="rotate(0)"/>
        <path d="M0 0 A40 40 0 0 1 40 -40 A40 40 0 0 1 0 0 Z" transform="rotate(72)"/>
        <path d="M0 0 A40 40 0 0 1 40 -40 A40 40 0 0 1 0 0 Z" transform="rotate(144)"/>
        <path d="M0 0 A40 40 0 0 1 40 -40 A40 40 0 0 1 0 0 Z" transform="rotate(216)"/>
        <path d="M0 0 A40 40 0 0 1 40 -40 A40 40 0 0 1 0 0 Z" transform="rotate(288)"/>
      </g>
      <circle class="b-accent" r="8"/>
    </g>
    <g transform="translate(895 236)" class="p-primary">
      <path d="M0 0 A32 32 0 0 1 32 -32 A32 32 0 0 1 0 0 Z" transform="rotate(20)"/>
      <path d="M0 0 A32 32 0 0 1 32 -32 A32 32 0 0 1 0 0 Z" transform="rotate(110)"/>
      <path d="M0 0 A32 32 0 0 1 32 -32 A32 32 0 0 1 0 0 Z" transform="rotate(200)"/>
      <path d="M0 0 A32 32 0 0 1 32 -32 A32 32 0 0 1 0 0 Z" transform="rotate(290)"/>
    </g>
    <g transform="translate(564 236)" class="p-primary">
      <path d="M0 0 A24 24 0 0 1 24 -24 A24 24 0 0 1 0 0 Z" transform="rotate(-30)"/>
      <path d="M0 0 A24 24 0 0 1 24 -24 A24 24 0 0 1 0 0 Z" transform="rotate(150)"/>
    </g>
  </svg>
  <div class="cv__text">
    <h1 class="cv__name">A&amp;M Wedding<br>Planner</h1>
    <p class="cv__tag">Every detail, a beautiful tomorrow — ivory, blush, burgundy and a little glass.</p>
  </div>
</div>
